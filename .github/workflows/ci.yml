name: Software Genome CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci || npm install

    - name: Run Genome Synthesis Unit Tests
      run: npm test

    - name: Audit Cleanroom IP Safeguards
      run: node -e "require('./lib/ip-shield.js'); console.log('🛡️ IP Shield Passed');"
