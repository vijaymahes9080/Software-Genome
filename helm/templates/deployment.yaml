apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgx-app-deployment
  labels:
    app: sgx-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sgx-app
  template:
    metadata:
      labels:
        app: sgx-app
    spec:
      containers:
      - name: sgx-app
        image: vijaymahes9080/software-genome:latest
        ports:
        - containerPort: 4000
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sgx-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sgx-app-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
